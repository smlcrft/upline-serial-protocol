name=Upline
version=1.0.0
author=Small Craft Inc.
maintainer=Adam Kumpf
sentence=The simplest serial protocol: newline-delimited ASCII key/value records for microcontrollers.
paragraph=Publish state, accept commands, and describe yourself over UART, USB, or Bluetooth serial. Header-only, no allocation, no libc, no floating point. A complete device fits in about 3.9 KB of flash on an Uno and runs on parts as small as an ATtiny85. Self-describing: a host asks "?" and gets back every key, type, default, and range, so it can build a whole interface for a device it has never seen.
category=Communication
