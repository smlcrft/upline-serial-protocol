name=Upline
version=2.0.0
author=Small Craft Inc.
maintainer=Adam Kumpf
sentence=The simplest serial protocol: newline-delimited ASCII entries for microcontrollers.
paragraph=Publish state, accept reads and writes, and describe yourself over UART, USB, or Bluetooth serial. Header-only, no allocation, no libc, no floating point. A complete device fits in about 4 KB of flash on an Uno and runs on parts as small as an ATtiny85. Self-describing: a host asks "?" and gets back the device identity, its receive limit, and every key with its mode, type, default and range, so it can build a whole interface for a device it has never seen. Numeric input is validated rather than silently coerced, so a corrupted value is refused instead of becoming a setpoint. Version 2 is a new wire format and a new handler API; see the spec for the grammar.
category=Communication
url=https://github.com/smlcrft/upline-serial-protocol
architectures=*
